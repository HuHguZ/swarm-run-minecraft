<svg xml:lang="ru" xmlns="http://www.w3.org/2000/svg" width="1120" height="608" viewBox="0 0 1120 608" role="img" aria-labelledby="title desc">
  <title id="title">Архитектура Swarm Run</title>
  <desc id="desc">Кампания спидрана и координатор арены управляют ботами независимо. Codex и Claude Code могут использовать локальный мост MCP. Все три компонента обращаются к демонам ботов по WebSocket RPC. Боты играют на сервере Paper по протоколу Minecraft. Тестовая ферма запускает изолированные миры Paper и процессы ботов.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#172536"/><stop offset="1" stop-color="#101822"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0l9 4.5L0 9Z" fill="#aabdd0"/>
    </marker>
  </defs>
  <rect width="1120" height="608" rx="22" fill="url(#bg)"/>
  <path d="M38 111H1082" stroke="#34465b"/>
  <g font-family="system-ui,Segoe UI,sans-serif" fill="#f0f5fa">
    <text x="48" y="65" font-size="38" font-weight="750">Swarm Run</text>
    <text x="48" y="92" font-size="16" fill="#bdcddc">Два игровых режима на одном клиентском движке Minecraft.</text>
    <g stroke-width="1.5">
      <rect x="48" y="139" width="310" height="129" rx="14" fill="#172a26" stroke="#4e9174"/>
      <rect x="405" y="139" width="310" height="129" rx="14" fill="#192c40" stroke="#6089ba"/>
      <rect x="762" y="139" width="310" height="129" rx="14" fill="#302820" stroke="#a98551"/>
      <rect x="249" y="344" width="622" height="114" rx="14" fill="#233346" stroke="#7b92aa"/>
      <rect x="249" y="514" width="622" height="57" rx="13" fill="#17212d" stroke="#6c8299"/>
    </g>
    <g font-size="13" font-weight="700" letter-spacing="1.2">
      <text x="68" y="167" fill="#9de3be">01  ·  АВТОНОМНАЯ ИГРА</text>
      <text x="425" y="167" fill="#a9d0ff">02  ·  КОМАНДНАЯ ИГРА</text>
      <text x="782" y="167" fill="#f1cd91">ОПЦИОНАЛЬНО  ·  АГЕНТ</text>
    </g>
    <g font-size="24" font-weight="700">
      <text x="68" y="200">Кампания спидрана</text>
      <text x="425" y="200">Координатор арены</text>
      <text x="782" y="200">Локальный MCP-мост</text>
      <text x="273" y="382">Один или несколько демонов ботов</text>
    </g>
    <g font-size="16" fill="#d3deea">
      <text x="68" y="227">Этапы, навыки, выбор стратегии</text>
      <text x="425" y="227">Общие наблюдения, роли, задачи</text>
      <text x="782" y="227">Codex или Claude Code через stdio</text>
      <text x="273" y="408">Сессия Mineflayer, восприятие мира, движение, бой и рефлексы</text>
      <text x="273" y="436" fill="#b6cde3" font-family="monospace">daemon/src/</text>
      <text x="273" y="549" font-weight="700" fill="#f0f5fa">Мир Paper</text>
      <text x="423" y="549">Minecraft Java 1.21.11</text>
    </g>
    <g font-size="13" font-family="monospace" fill="#b6cde3">
      <text x="68" y="249">daemon/campaign/ + daemon/src/core/</text>
      <text x="425" y="249">farm/arena/ + farm/swarm/</text>
      <text x="782" y="249">mcp/</text>
      <text x="75" y="533">farm/</text>
    </g>
    <g fill="none" stroke="#aabdd0" stroke-width="2" marker-end="url(#arrow)">
      <path d="M203 268v35h117v37"/>
      <path d="M560 268v72"/>
      <path d="M917 268v35H800v37"/>
      <path d="M560 458v52"/>
    </g>
    <g font-size="13" fill="#bacbda">
      <text x="576" y="304">RPC по WebSocket</text>
      <text x="576" y="489">Протокол Minecraft</text>
      <text x="75" y="552">Тестовые миры</text>
      <path d="M212 542h32" stroke="#778ea4" stroke-dasharray="4 4"/>
    </g>
  </g>
</svg>
